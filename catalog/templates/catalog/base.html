<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeviceStore</title>
    <!-- Подключите статичеcкие файлы со стилями Bootstrap -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">

</head>
<body>
    <div class="col-6-sm-4 offset-md-1 py-4">
      <h4>Навигация</h4>
      <ul class="list-unstyled text-small">
        <li><a class="text-muted" href="{% url 'catalog:products_list' %}">Главная</a></li>
        {% if user.is_authenticated %}
          <li>
            <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
              {% csrf_token %}
              <button type="submit" class="btn btn-link text-muted" style="padding: 0; border: none; background: none;">
                Выход
              </button>
            </form>
          </li>
        {% else %}
          <li><a class="text-muted" href="{% url 'users:login' %}">Войти</a></li>
          <li><a class="text-muted" href="{% url 'users:register' %}">Регистрация</a></li>
        {% endif %}
      </ul>
    </div>
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
    <footer class="pt-4 my-md-5 pt-md-5 border-top px-4">
      <div class="row">
        <div class="col-12 col-md">
          DeviceStore
          <small class="d-block mb-3 text-muted">&copy; 2025</small>
        </div>
        <div class="col-6 col-md">
          <h5>Категория</h5>
          <ul class="list-unstyled text-small">
            <li><a class="text-muted" href="#">Смартфоны</a></li>
            <li><a class="text-muted" href="#">Телевизоры</a></li>
          </ul>
        </div>
        <div class="col-6 col-md">
          <h5>Дополнительно</h5>
          <ul class="list-unstyled text-small">
            <li><a class="text-muted" href="#">Мы пишем</a></li>
          </ul>
        </div>
        <div class="col-6 col-md">
          <h5>О нас</h5>
          <ul class="list-unstyled text-small">
            <li><a class="text-muted" href="{% url 'catalog:contacts' %}">Контакты</a></li>
          </ul>
        </div>
      </div>
    </footer>
    <!-- Подключение Bootstrap JS -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
